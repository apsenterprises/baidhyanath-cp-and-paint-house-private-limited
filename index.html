<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baidhyanath CP & Paint House Pvt Ltd</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

/* VIDEO HERO CSS */
.hero{
position:relative;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
overflow:hidden;
}

.bg-video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-1;
}

.hero-content{
position:relative;
z-index:1;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
padding:10px 30px;
background:rgba(0,0,0,0.5);
color:white;
z-index:1000;
}

.logo img{
width:50px;
}

/* BUTTON */
.btn{
padding:10px 20px;
border:none;
background:#00c6ff;
color:white;
border-radius:20px;
cursor:pointer;
margin-top:10px;
}

/* PRODUCTS */
.products{
padding:60px 20px;
text-align:center;
}

.cards{
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
}

.card{
background:white;
padding:20px;
width:250px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
cursor:pointer;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
}

/* DETAILS */
#productDetails{
padding:40px;
text-align:center;
}

/* CONTACT */
.contact{
padding:40px;
background:#0a58ca;
color:white;
text-align:center;
}

/* MAP */
.map iframe{
width:100%;
height:300px;
border:0;
}

/* FLOAT BUTTON */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
}

.call{
position:fixed;
bottom:90px;
right:20px;
background:#007bff;
color:white;
padding:15px;
border-radius:50%;
}

/* FOOTER */
footer{
text-align:center;
padding:15px;
background:#111;
color:white;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">
<img src="logo.png">
</div>
<h3>Baidhyanath Paint</h3>
</nav>

<!-- HERO WITH VIDEO -->
<section class="hero">

<video autoplay muted loop playsinline class="bg-video">
<source src="https://cdn.coverr.co/videos/coverr-working-on-a-laptop-5176/1080p.mp4" type="video/mp4">
</video>

<div class="hero-content">
<h1>All Pipes, Paint & Sanitary Available</h1>
<button class="btn" onclick="scrollToContact()">Contact</button>
</div>

</section>

<!-- PRODUCTS -->
<section class="products" id="products">
<h2>Our Products</h2>

<div class="cards">

<div class="card" onclick="showProducts('pipe')">
<img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952">
<h3>Pipes</h3>
</div>

<div class="card" onclick="showProducts('fitting')">
<img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c">
<h3>Fittings</h3>
</div>

<div class="card" onclick="showProducts('paint')">
<img src="https://images.unsplash.com/photo-1598300056393-4aac492f4344">
<h3>Paint</h3>
</div>

<div class="card" onclick="showProducts('tank')">
<img src="https://images.unsplash.com/photo-1621905251918-48416bd8575a">
<h3>Water Tank</h3>
</div>

<div class="card" onclick="showProducts('sanitary')">
<img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a">
<h3>Sanitary Ware</h3>
</div>

</div>
</section>

<!-- PRODUCT DETAILS -->
<section id="productDetails">
<h2>Product Details</h2>
<div id="detailsBox"></div>
</section>

<!-- CONTACT -->
<section class="contact" id="contact">
<h2>Contact</h2>
<p>📍 Chhabilpur Road, Rajgir Nalanda</p>
<p>📞 8210909879</p>
</section>

<!-- MAP -->
<section class="map">
<iframe src="https://www.google.com/maps?q=Rajgir%20Nalanda&output=embed"></iframe>
</section>

<!-- FLOAT BUTTON -->
<a href="https://wa.me/918210909879" class="whatsapp">💬</a>
<a href="tel:8210909879" class="call">📞</a>

<!-- FOOTER -->
<footer>
<p>© 2026 Baidhyanath CP & Paint House</p>
</footer>

<script>

/* Scroll */
function scrollToContact(){
document.getElementById("contact").scrollIntoView({behavior:"smooth"});
}

/* Order */
function orderNow(product){
let phone="918210909879";
let msg="Hello, I want to order "+product;
window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg));
}

/* Product Show */
function showProducts(type){

let data = {
pipe: ["PVC Pipe", "CPVC Pipe", "UPVC Pipe"],
fitting: ["Elbow", "Tee", "Coupling"],
paint: ["Interior Paint", "Exterior Paint", "Waterproof Paint"],
tank: ["500L Tank", "1000L Tank", "2000L Tank"],
sanitary: ["Wash Basin", "Toilet Seat", "Tap & Shower"]
};

let html = "";

data[type].forEach(item=>{
html += `<p>${item} <button onclick="orderNow('${item}')">Order</button></p>`;
});

document.getElementById("detailsBox").innerHTML = html;

document.getElementById("productDetails").scrollIntoView({behavior:"smooth"});
}

</script>

</body>
</html>
