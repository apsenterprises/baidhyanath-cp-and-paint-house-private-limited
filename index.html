<style>
*{
margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{background:#000;color:#fff;}

/* LOADER */
#loader{
position:fixed;
width:100%;
height:100vh;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.loader-text{
font-size:25px;
animation:blink 1s infinite;
}

@keyframes blink{
0%,100%{opacity:1;}
50%{opacity:0;}
}

/* NAV */
nav{
display:flex;justify-content:space-between;align-items:center;
padding:10px 30px;
background:rgba(0,0,0,0.5);
position:fixed;
width:100%;
z-index:1000;
}

.logo{display:flex;align-items:center;}
.logo img{width:55px;margin-right:10px;}

nav ul{display:flex;list-style:none;}
nav ul li{margin-left:20px;}
nav ul li a{color:white;text-decoration:none;}

/* HERO WITH VIDEO */
.hero{
position:relative;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
}

.hero video{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
z-index:-1;
}

.hero-content{
z-index:1;
}

.hero h1{font-size:40px;}

.btn{
padding:12px 25px;
background:#00c6ff;
border:none;
color:white;
border-radius:25px;
cursor:pointer;
margin-top:15px;
}

/* PRODUCTS */
.products{
padding:60px 20px;
text-align:center;
background:#111;
}

.cards{
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
}

.card{
background:#222;
padding:20px;
width:250px;
border-radius:10px;
transition:0.4s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

/* FLOAT BUTTON */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50%;
color:white;
}

.call{
position:fixed;
bottom:90px;
right:20px;
background:#007bff;
padding:15px;
border-radius:50%;
color:white;
}

/* FOOTER */
footer{
text-align:center;
padding:15px;
background:#000;
}
</style>

</head>

<script>

/* Order */
function orderNow(product){
let phone="918210909879";
let msg="Hello, I want to order "+product;
window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg));
}

/* Product Show */
function showProducts(type){

let data = {
pipe: ["PVC Pipe", "CPVC Pipe", "UPVC Pipe"],
fitting: ["Elbow", "Tee", "Coupling"],
paint: ["Interior Paint", "Exterior Paint", "Waterproof Paint"],
tank: ["500L Tank", "1000L Tank", "2000L Tank"],
sanitary: ["Wash Basin", "Toilet Seat", "Tap & Shower"]
};

let html = "";

data[type].forEach(item=>{
html += `<p>${item} <button onclick="orderNow('${item}')">Order</button></p>`;
});

document.getElementById("detailsBox").innerHTML = html;

document.getElementById("productDetails").scrollIntoView({behavior:"smooth"});
}
</script>
